services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-actionflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - actionflow-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-postgres}",
          "-d",
          "${POSTGRES_DB:-actionflow}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  actionflow-data:
