services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_DB: actionflow
      POSTGRES_USER: actionflow
      POSTGRES_PASSWORD: ${ACTIONFLOW_DB_PASSWORD:?Set ACTIONFLOW_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - actionflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "actionflow", "-d", "actionflow"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  actionflow-data:
