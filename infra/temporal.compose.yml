services:
  temporal-postgres:
    image: postgres:16.16
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD}
    volumes:
      - temporal-data:/var/lib/postgresql/data
      - ./temporal/create-visibility.sql:/docker-entrypoint-initdb.d/01-visibility.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal", "-d", "temporal", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD}
    volumes:
      - ./temporal/setup-schema.sh:/setup-schema.sh:ro
    entrypoint: ["/bin/sh", "/setup-schema.sh"]
  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?Set TEMPORAL_DB_PASSWORD}
      SKIP_SCHEMA_SETUP: "true"
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 2s
      timeout: 3s
      retries: 60
  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-ec"]
    command: ["temporal operator namespace describe --namespace default || temporal operator namespace create --namespace default"]
    restart: "on-failure:5"
volumes:
  temporal-data:
