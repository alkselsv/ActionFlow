[project]
name = "actionflow"
version = "0.1.0"
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "sqlalchemy==2.1.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx2==2.16.2", "pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
